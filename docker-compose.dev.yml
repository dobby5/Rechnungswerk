services:
  api:
    build:
      target: development
    command: sh -c "pnpm --filter @rechnungswerk/api migration:run && pnpm --filter @rechnungswerk/api seed && pnpm --filter @rechnungswerk/api dev"
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    read_only: false

  web:
    build:
      target: development
    command: pnpm --filter @rechnungswerk/web dev --host 0.0.0.0 --port 8080
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    read_only: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]

volumes:
  api_node_modules:
  web_node_modules:
