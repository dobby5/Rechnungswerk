name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Create ephemeral CI environment
        shell: bash
        run: |
          cp .env.example .env
          db_password="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_PASSWORD=${db_password}"
            echo "DATABASE_URL=postgresql://rechnungswerk:${db_password}@db:5432/rechnungswerk"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=ci-admin@example.invalid"
            echo "ADMIN_PASSWORD=$(openssl rand -base64 24)"
          } >> .env
      - run: docker compose config --quiet
      - run: docker compose build
